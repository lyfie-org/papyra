# Source of truth for repo labels. Synced by .github/workflows/labels.yml.
# Edit here, never in the GitHub UI. Labels not listed are left alone.
# `from_name` renames a label in place so existing issues keep it.

- name: bug
  color: d73a4a
  description: Something isn't working
  from_name: "type: bug"
- name: enhancement
  color: 7aaa8a
  description: New feature or request
  from_name: "type: feature"
- name: documentation
  color: 0075ca
  description: Improvements or additions to docs
  from_name: "type: docs"
- name: question
  color: d876e3
  description: Usage question, better asked on Discord
- name: good first issue
  color: 7057ff
  description: Small and well described, a good place to start
- name: help wanted
  color: 008672
  description: Open for anyone to take, comment /take
- name: needs info
  color: fbca04
  description: Waiting on the reporter, closes after 21 quiet days
  from_name: "needs: info"
- name: duplicate
  color: cfd3d7
  description: Already reported
- name: wontfix
  color: ffffff
  description: Won't be worked on
- name: invalid
  color: e4e669
  description: Not a Papyra problem or not actionable
