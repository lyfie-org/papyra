name: Sync labels

# Keeps the repo's labels identical to .github/labels.yml. Add or change a label
# there, push, and this applies it. Nothing is ever deleted (skip-delete), so a
# hand-made label survives until you remove it yourself.
on:
  push:
    branches: [main, development]
    paths: [.github/labels.yml, .github/workflows/labels.yml]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  labels:
    name: Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          yaml-file: .github/labels.yml
          skip-delete: true
