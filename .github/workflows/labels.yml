name: Sync labels

# Keeps the repo's labels identical to .github/labels.yml. Add or change a label
# there, push, and this applies it. Nothing is ever deleted (skip-delete), so a
# hand-made label survives until you remove it yourself.
on:
  push:
    branches: [main, development]
    paths: [.github/labels.yml, .github/workflows/labels.yml]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  labels:
    name: Sync labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crazy-max/ghaction-github-labeler@v5
        with:
          yaml-file: .github/labels.yml
          skip-delete: true
