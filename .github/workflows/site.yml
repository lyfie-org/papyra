name: site

# Builds and deploys the product website (papyra.app).
#
# Deployed from Actions rather than through Cloudflare Pages' own Git
# integration: the build reaches across the monorepo into papyra.web to produce
# the live demo, and it needs the exact toolchain this repo pins — Node 22 and
# pnpm 11.5.1 — which is already solved here and would need coaxing in the Pages
# build image.
#
# Requires two repository secrets, added by hand in Settings → Secrets:
#   CLOUDFLARE_API_TOKEN    — scoped to "Cloudflare Pages — Edit"
#   CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [main, development]
    paths:
      - 'papyra.app/**'
      - 'papyra.web/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'papyra.app/**'
      - 'papyra.web/**'
  # So a deploy can be re-run without an empty commit.
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The Pages action comments the preview URL on pull requests.
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check design tokens have not drifted from the app
        run: pnpm --filter papyra-app run check:tokens

      # Must run BEFORE the site build: it writes into papyra.app/public/demo,
      # which Astro then copies into dist.
      - name: Build the in-browser demo
        run: pnpm --filter papyra-web run build:demo

      - name: Build the site
        run: pnpm --filter papyra-app run build

      # A silently-ignored rule here means deep links 404 in production, and the
      # only signal is a line in wrangler's output — so make it a hard gate.
      - name: Verify the demo's SPA fallback shipped
        run: |
          test -f papyra.app/dist/demo/404.html \
            || { echo "::error::papyra.app/dist/demo/404.html is missing — deep links into the demo will 404. See demoBuild() in papyra.web/vite.config.ts."; exit 1; }
          test -f papyra.app/dist/_headers
          echo "SPA fallback and headers present."

      # No third-party origin may appear in the shipped output: it is what makes
      # the site behave identically on every network, including ones where
      # Google's CDNs are unreachable. Fonts are self-hosted; nothing else is remote.
      - name: Verify no third-party font origin shipped
        run: |
          # Pages and stylesheets only. The editor bundle (@lyfie/luthor) carries
          # Google Fonts URLs for its own in-editor font picker; the CSP blocks
          # them and no page ever requests one, so scanning JS would only produce
          # a permanent false positive.
          hits=$(grep -rl 'fonts\.googleapis\.com\|fonts\.gstatic\.com' papyra.app/dist \
                   --include='*.html' --include='*.css' || true)
          if [ -n "$hits" ]; then
            echo "::error::A third-party font origin is referenced in the built pages."
            echo "$hits"
            exit 1
          fi
          echo "No third-party font origin in the shipped pages."

      # Wrangler is run straight from papyra.app's own devDependencies rather than
      # through cloudflare/wrangler-action. The action installs its own copy, and
      # in a pnpm workspace that install fails outright — pnpm refuses to add a
      # package to the workspace root without -w ("failed with exit code 1"
      # before it ever reaches authentication). Calling it directly also pins the
      # deploy to the same wrangler version the lockfile already resolves.
      #
      # Secrets come in as environment variables, which wrangler reads natively.
      #
      # Skipped for pull requests from forks: GitHub withholds secrets there, so
      # the deploy could only ever fail. Everything above still runs, so an
      # outside contribution is still fully built and checked.
      # Sideways scroll is invisible until somebody opens the site on a phone,
      # and it is caused by ordinary things: a wide table, a long URL, a grid
      # track that will not shrink. Checking it in a real browser is the only
      # way to know. Chromium is ~115 MB, which is worth it for a class of bug
      # that otherwise ships.
      - name: Install Chromium for the layout check
        run: pnpm --filter papyra-app exec playwright install --with-deps chromium

      - name: Check no page scrolls horizontally
        run: pnpm --filter papyra-app run check:layout

      - name: Deploy to Cloudflare Pages
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        working-directory: papyra.app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set. Add them under Settings → Secrets and variables → Actions. The Pages project must also already exist: wrangler pages project create papyra --production-branch=main"
            exit 1
          fi
          # main → production (papyra.app); every other branch → a preview URL.
          pnpm exec wrangler pages deploy dist \
            --project-name=papyra \
            --branch="${{ github.head_ref || github.ref_name }}"
