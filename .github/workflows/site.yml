name: site

# Builds and deploys the product website. Two lines (see .github/RELEASE_LINES.md):
#
#   main        → production, https://papyra.app  (push, daily schedule, or by hand)
#   development → dev preview, https://dev.papyra.app  (by hand only)
#
# The dev build sets PUBLIC_SITE_CHANNEL=dev: every page is noindex, robots.txt
# blocks all crawlers, no sitemap ships, and a banner points at papyra.app and
# the `lyfie/papyra:dev` image. Both lines deploy to the same Cloudflare Pages
# project; dev.papyra.app is a custom domain on its `development` branch alias.
#
# Deployed from Actions rather than through Cloudflare Pages' own Git
# integration: the build reaches across the monorepo into papyra.web to produce
# the live demo, and it needs the exact toolchain this repo pins — Node 22 and
# pnpm 11.5.1 — which is already solved here and would need coaxing in the Pages
# build image.
#
# Requires two repository secrets, added by hand in Settings → Secrets:
#   CLOUDFLARE_API_TOKEN    — scoped to "Cloudflare Pages — Edit"
#   CLOUDFLARE_ACCOUNT_ID

# Push-only on purpose: a PR from development → main would otherwise run the
# same build twice (once for the push, once for the PR). The merge into main is
# itself a push, so production still deploys. development is not here: the dev
# site moves only when you run this workflow on it by hand.
on:
  push:
    branches: [main]
    paths:
      - 'papyra.app/**'
      - 'papyra.web/**'
      # The home page reads the current version from the repo root (src/lib/changelog.mjs).
      - 'CHANGELOG.md'
      # The contribute page renders this from the repo root.
      - 'CONTRIBUTING.md'
      - 'VERSION'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/site.yml'
      - '.github/actions/**'
  # Re-run production without an empty commit, or — run on development — deploy
  # the dev site.
  workflow_dispatch:
  # Daily rebuild of main, so the Docker Hub pull count and GitHub star count
  # baked into the pages stay current (src/lib/stats.mjs). The site itself stays
  # fully static — no Functions or Workers — so traffic never meets a limit.
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # main → prod, development → dev; any other ref has no site to deploy to.
      - name: Resolve channel
        id: channel
        run: |
          case "${{ github.ref_name }}" in
            main)        echo "channel=prod" >> "$GITHUB_OUTPUT"; echo "url=https://papyra.app" >> "$GITHUB_OUTPUT" ;;
            development) echo "channel=dev"  >> "$GITHUB_OUTPUT"; echo "url=https://dev.papyra.app" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::The site deploys from main (production) or development (dev) only, not '${{ github.ref_name }}'."; exit 1 ;;
          esac

      - uses: actions/checkout@v7

      # The site plus the web app it embeds as /demo — not the collab engine.
      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm
        with:
          install-args: --filter papyra-app... --filter papyra-web...

      - name: Check design tokens have not drifted from the app
        run: pnpm --filter papyra-app run check:tokens

      # Must run BEFORE the site build: it writes into papyra.app/public/demo,
      # which Astro then copies into dist.
      - name: Build the in-browser demo
        run: pnpm --filter papyra-web run build:demo

      - name: Build the site
        env:
          PUBLIC_SITE_CHANNEL: ${{ steps.channel.outputs.channel }}
        run: pnpm --filter papyra-app run build

      # The dev site must never be indexed; prove the build marked it so.
      - name: Verify the dev build is noindex
        if: steps.channel.outputs.channel == 'dev'
        run: |
          grep -q 'name="robots" content="noindex' papyra.app/dist/index.html \
            || { echo "::error::dist/index.html is missing the noindex robots meta."; exit 1; }
          grep -q 'X-Robots-Tag: noindex' papyra.app/dist/_headers \
            || { echo "::error::dist/_headers is missing X-Robots-Tag: noindex."; exit 1; }
          grep -qx 'Disallow: /' papyra.app/dist/robots.txt \
            || { echo "::error::dist/robots.txt does not block crawlers."; exit 1; }
          test ! -e papyra.app/dist/sitemap-index.xml \
            || { echo "::error::The dev build shipped a sitemap."; exit 1; }
          echo "Dev build is noindex."

      # A silently-ignored rule here means deep links 404 in production, and the
      # only signal is a line in wrangler's output — so make it a hard gate.
      - name: Verify the demo's SPA fallback shipped
        run: |
          test -f papyra.app/dist/demo/404.html \
            || { echo "::error::papyra.app/dist/demo/404.html is missing — deep links into the demo will 404. See demoBuild() in papyra.web/vite.config.ts."; exit 1; }
          test -f papyra.app/dist/_headers
          echo "SPA fallback and headers present."

      # No third-party origin may appear in the shipped output: it is what makes
      # the site behave identically on every network, including ones where
      # Google's CDNs are unreachable. Fonts are self-hosted; nothing else is remote.
      - name: Verify no third-party font origin shipped
        run: |
          # Pages and stylesheets only. The editor bundle (@lyfie/luthor) carries
          # Google Fonts URLs for its own in-editor font picker; the CSP blocks
          # them and no page ever requests one, so scanning JS would only produce
          # a permanent false positive.
          hits=$(grep -rl 'fonts\.googleapis\.com\|fonts\.gstatic\.com' papyra.app/dist \
                   --include='*.html' --include='*.css' || true)
          if [ -n "$hits" ]; then
            echo "::error::A third-party font origin is referenced in the built pages."
            echo "$hits"
            exit 1
          fi
          echo "No third-party font origin in the shipped pages."

      # Sideways scroll is invisible until somebody opens the site on a phone,
      # and it is caused by ordinary things: a wide table, a long URL, a grid
      # track that will not shrink. Checking it in a real browser is the only
      # way to know. Chromium is ~115 MB, which is worth it for a class of bug
      # that otherwise ships.
      #
      # The browser download is cached per Playwright version; on a hit only the
      # system libraries (apt) still need installing.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter papyra-app exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium for the layout check
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter papyra-app exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter papyra-app exec playwright install-deps chromium

      - name: Check no page scrolls horizontally
        run: pnpm --filter papyra-app run check:layout

      # Wrangler is run straight from papyra.app's own devDependencies rather than
      # through cloudflare/wrangler-action. The action installs its own copy, and
      # in a pnpm workspace that install fails outright — pnpm refuses to add a
      # package to the workspace root without -w ("failed with exit code 1"
      # before it ever reaches authentication). Calling it directly also pins the
      # deploy to the same wrangler version the lockfile already resolves.
      #
      # Secrets come in as environment variables, which wrangler reads natively.
      - name: Deploy to Cloudflare Pages
        working-directory: papyra.app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set. Add them under Settings → Secrets and variables → Actions. The Pages project must also already exist: wrangler pages project create papyra --production-branch=main"
            exit 1
          fi
          # main → production (papyra.app); development → its branch alias
          # (development.papyra.pages.dev), which dev.papyra.app points at.
          pnpm exec wrangler pages deploy dist \
            --project-name=papyra \
            --branch="${{ github.ref_name }}"
          echo "Deployed ${{ steps.channel.outputs.channel }} → ${{ steps.channel.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
