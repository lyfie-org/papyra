name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Papyra.slnx

      - name: Build (Release)
        run: dotnet build Papyra.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test papyra.api/tests/Papyra.Tests/Papyra.Tests.csproj --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend — type-check, test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: papyra.web/package-lock.json

      - name: Install dependencies
        working-directory: papyra.web
        run: npm ci

      - name: Type-check
        working-directory: papyra.web
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: papyra.web
        run: npm test

      - name: Production build
        working-directory: papyra.web
        run: npm run build
