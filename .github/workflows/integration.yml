name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore Papyra.slnx

      - name: Build (Release)
        run: dotnet build Papyra.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test papyra.api/tests/Papyra.Tests/Papyra.Tests.csproj --configuration Release --no-build --verbosity normal
