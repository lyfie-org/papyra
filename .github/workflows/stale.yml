name: Stale

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Close stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9.1.0
        with:
          only-labels: "needs info"
          days-before-issue-stale: 14
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          remove-stale-when-updated: true
          stale-issue-message: >
            This has been waiting for more information for 14 days. If you can
            add it, reply and it stays open. Otherwise it closes in 7 days.
          close-issue-message: >
            Closing for now since the details we asked for didn't arrive.
            Reopen it any time with the answers.
