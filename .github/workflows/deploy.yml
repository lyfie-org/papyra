name: Deploy

on:
  workflow_dispatch:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-push:
    name: Build, tag, and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for tagging)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine next version
        id: version
        run: |
          git fetch --tags
          LATEST=$(git tag -l 'v*.*.*' | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            NEXT="v1.0.0"
          else
            # Strip leading 'v', split on '.', increment patch
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Tag commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.next }}"
          git push origin "${{ steps.version.outputs.next }}"


      - name: Build local image for Smoke Test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # Only need to test one architecture for the smoke test
          load: true # Load it into the local Docker daemon instead of pushing
          tags: papyra-smoketest:latest

      - name: Run Smoke Test
        run: |
          # 1. Boot the container in the background
          docker run -d -p 8080:8080 --name smoke-test papyra-smoketest:latest
          
          # 2. Wait up to 10 seconds for the app to boot
          echo "Waiting for container to initialize..."
          sleep 10
          
          # 3. Check if the container crashed (like the ICU error)
          if [ "$(docker inspect -f '{{.State.Status}}' smoke-test)" != "running" ]; then
            echo "Container crashed on boot! Logs:"
            docker logs smoke-test
            exit 1 # Fail the pipeline
          fi
          
          # 4. Check if the app is actually responding
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health || echo "Failed")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Health endpoint returned $HTTP_STATUS"
            docker logs smoke-test
            exit 1 # Fail the pipeline
          fi
          
          echo "Smoke test passed perfectly!"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            lyfie/papyra:${{ steps.version.outputs.next }}
            lyfie/papyra:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Sync main → development
        run: |
          git fetch origin development
          git checkout development
          git merge --ff-only origin/main
          git push origin development
