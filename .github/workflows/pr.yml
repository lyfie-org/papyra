name: Pull request hygiene

# Labels a PR from the files it touches and checks the title follows
# `type(scope): summary`, the same style as the commit history. Runs on
# pull_request_target so it can label PRs from forks; it never checks out or
# runs the PR's code, only reads the list of changed files.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label by path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  title:
    name: Check title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            perf
            ci
            build
            style
            revert
          requireScope: false
