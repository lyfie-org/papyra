# Path-based PR labels, applied by .github/workflows/pr.yml (actions/labeler v5).
"pkg: api":
  - changed-files:
      - any-glob-to-any-file: papyra.api/**
"pkg: web":
  - changed-files:
      - any-glob-to-any-file: papyra.web/**
"pkg: collab":
  - changed-files:
      - any-glob-to-any-file: papyra.collab/**
"pkg: site":
  - changed-files:
      - any-glob-to-any-file: [papyra.app/**, docs/**]
"pkg: versions":
  - changed-files:
      - any-glob-to-any-file: papyra.versions/**
"pkg: ops":
  - changed-files:
      - any-glob-to-any-file: [Dockerfile, docker-compose*.yml, entrypoint.sh]
"pkg: ci":
  - changed-files:
      - any-glob-to-any-file: .github/**
"type: docs":
  - changed-files:
      - all-globs-to-all-files: ["**/*.md", "**/*.mdx"]
