name: Setup pnpm workspace
description: >-
  pnpm + Node 22 with the pnpm store cached, then a frozen-lockfile install.
  The one place the toolchain versions are pinned for every workflow.

inputs:
  install-args:
    description: >-
      Extra arguments for `pnpm install`, usually `--filter <pkg>...` so a job
      installs only the workspace packages it builds (skipping, say, Astro,
      Playwright and wrangler/workerd when it only checks the web app).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: 11.5.1

    - name: Setup Node 22
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: pnpm

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile ${{ inputs.install-args }}
