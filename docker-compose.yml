# Builds Papyra from source. Run `docker compose up --build`, open http://localhost:8080

services:
  papyra:
    build:
      context: .
      dockerfile: Dockerfile
    image: papyra:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - papyra-data:/data
    environment:
      Cors__AllowedOrigins__0: "http://localhost:8080"
      TZ: "UTC"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  papyra-data:
