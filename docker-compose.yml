services:
  papyra:
    build:
      context: .
      dockerfile: Dockerfile
    image: papyra:latest
    ports:
      - "8080:8080"
    volumes:
      # Use ./data:/data instead for Syncthing/Obsidian bind-mount access
      - papyra_data:/data
    environment:
      Storage__StorageRoot: /data
      # Lucene index is rebuilt from /data on startup — keep it outside the volume
      Index__Directory: /app/index
      Cors__AllowedOrigins__0: "http://localhost:8080"
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  papyra_data:
