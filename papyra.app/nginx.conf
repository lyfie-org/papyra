# Serves the built site the way Cloudflare Pages does (see public/_headers and
# public/_redirects), closely enough to judge a change before it is pushed.
# Caching is deliberately off, so an edit is visible on the next rebuild.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown;

    # The same policy as production: nothing may load from outside this origin.
    # (No Strict-Transport-Security here — this is plain HTTP.)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;

    error_page 404 /404.html;

    # public/_redirects
    location = /features { return 301 /#features; }
    location ^~ /features/ { return 301 /#features; }

    # The demo is a client-side-routed app: a deep link has no file behind it,
    # so it gets the app's shell (on Pages that is demo/404.html).
    location /demo/ {
        try_files $uri $uri/index.html /demo/index.html;
    }

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }
}
