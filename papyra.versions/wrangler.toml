name = "papyra-versions"
main = "src/index.js"
compatibility_date = "2026-10-01"

# versions.papyra.app (the zone must be on this Cloudflare account).
routes = [{ pattern = "versions.papyra.app", custom_domain = true }]

[vars]
GITHUB_REPO = "lyfie-org/papyra"

# Create with:  npx wrangler d1 create papyra-versions   then paste the id here and run
#               npx wrangler d1 execute papyra-versions --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "papyra-versions"
database_id = "e7e29202-8202-49b8-b531-58dbf833d022"

# No request logs, no traces: this Worker keeps counts, not a record of visitors.
[observability]
enabled = false
