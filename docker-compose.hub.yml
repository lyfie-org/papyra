# Papyra — self-hosted notes. Run `docker compose up -d`, open http://localhost:8080
# All settings: https://papyra.app/docs/configuration/

services:
  papyra:
    image: lyfie/papyra:${PAPYRA_TAG:-latest}
    container_name: papyra
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - papyra-data:/data
    environment:
      TZ: "UTC"
      PUID: "1000"
      PGID: "1000"
      PAPYRA_ALLOW_INSECURE_COOKIES: "false"
      # Optional: set chat notifications up here instead of in Settings. Read once, on first start.
      # https://papyra.app/docs/notifications/
      # PAPYRA_NTFY_URL: "https://ntfy.example.com"
      # PAPYRA_NTFY_TOKEN: ""
      # PAPYRA_TELEGRAM_BOT_TOKEN: ""
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  papyra-data:
