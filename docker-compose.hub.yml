# Papyra — self-hosted notes. Run `docker compose up -d`, open http://localhost:8080
# All settings: https://papyra.app/docs/configuration/

services:
  papyra:
    image: lyfie/papyra:latest
    container_name: papyra
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - papyra-data:/data
    environment:
      TZ: "UTC"
      PUID: "1000"
      PGID: "1000"
      PAPYRA_ALLOW_INSECURE_COOKIES: "false"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  papyra-data:
