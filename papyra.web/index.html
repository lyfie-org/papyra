<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Installed (home-screen) app: the status bar takes the page's colour — the
         script below and ThemeProvider keep it in step with light/dark — and the
         app opens full-screen without browser chrome. -->
    <meta name="theme-color" content="#f2ebe0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Papyra" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Papyra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Sora:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!--
      Anti-flash theme script — runs synchronously before first paint so the
      correct data-theme is on <html> before any CSS is applied.
    -->
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('papyra-theme'); } catch (e) {}
        var theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : saved !== 'system' && location.pathname.indexOf('/shared/') === 0
            ? 'light' // a share-link visitor starts on paper (see ThemeProvider)
            : window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        var bar = document.querySelector('meta[name="theme-color"]');
        if (bar) bar.setAttribute('content', theme === 'dark' ? '#1c1917' : '#f2ebe0');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
