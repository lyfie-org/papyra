packages:
  - papyra.web
  - papyra.app
  - papyra.collab
# esbuild's install script only unpacks its own platform binary, which its API
# refuses to run without. Approved so Astro's toolchain works on a clean CI
# checkout; every other package still has its scripts blocked by default.
allowBuilds:
  esbuild: true
  # Cloudflare's own runtime, pulled in by wrangler so `pnpm --filter papyra-app
  # run preview:cf` can serve dist/ exactly as Pages will — including _headers
  # and the _redirects SPA fallback. Its install script places its native binary.
  workerd: true
# @lyfie/luthor is first-party (lyfie-org), and 2.9.x lands the editor APIs
# Papyra depends on. pnpm's 24h minimumReleaseAge gate rejects a same-day
# publish; version-pinned excludes are not honoured by the lockfile verifier,
# so the package name is excluded instead. Scoped to these two packages only -
# the policy still guards every other dependency.
minimumReleaseAgeExclude:
  - '@lyfie/luthor'
  - '@lyfie/luthor-headless'
  - brace-expansion@5.0.7
  - shell-quote@1.8.5
  - brace-expansion@5.0.8
  - postcss@8.5.23
  - brace-expansion@5.0.9
  - nanoid@3.3.16
  - nanoid@3.3.18
  - postcss@8.5.18
  - browserslist@4.28.7
  - vitest@4.1.11
  - '@vitest/mocker@4.1.11'
  - baseline-browser-mapping@2.11.0
  - undici@8.10.2
  - brace-expansion@5.0.12
  - brace-expansion@5.0.11
  - brace-expansion@5.0.10
  - devalue@5.9.3
  - smol-toml@1.8.1
  - source-map-js@1.2.2
  - sharp@0.35.5
  - shell-quote@1.11.0
  - vite@8.1.6
  - '@vitest/mocker@4.1.12'
  - zod@4.6.6
  - undici@8.12.2
  - minimatch@11.0.1
# Exactly one Yjs in every bundle: two copies break `instanceof` checks and
# corrupt collaboration docs ("Yjs was already imported"). The editor (via
# @lexical/yjs), the Hocuspocus provider and the collab server must agree.
overrides:
  yjs: 13.6.33
